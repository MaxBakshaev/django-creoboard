name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_DEBUG: "0"
      # Throwaway values for the CI run only; real secrets never reach this workflow.
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
      DATABASE_URL: postgres://creoboard:creoboard@127.0.0.1:5432/creoboard
      PYTEST_ADDOPTS: --cov --cov-report=term-missing
    services:
      postgres:
        image: postgres:16.11-alpine
        env:
          POSTGRES_DB: creoboard
          POSTGRES_USER: creoboard
          POSTGRES_PASSWORD: creoboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creoboard -d creoboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint
        run: make lint
      - name: Django check and missing migrations
        run: make check
      - name: Django deployment check
        run: make check-deploy
      - name: Tests
        run: make test

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build backend image (no push)
        run: docker build --tag creoboard-backend:ci backend
